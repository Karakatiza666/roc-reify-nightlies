on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of Karakatiza666/roc to build."
        type: string
        default: reify
      base_nightly:
        description: "The roc-lang/nightlies tag that the ref is rebased on, for example nightly-2026-11-03-34bd006. Its date becomes the date of the release tag."
        type: string
        required: true

name: Nightly release for new compiler (reify)

# Do not add permissions here! Configure them at the job level!
permissions: {}

# Two manual runs can otherwise overlap: the tag guard in resolve-roc-ref
# reads existing tags, so a run that starts while another is still building
# sees no tag yet. Queueing the newcomer means it resolves after the first has
# published, and the guard then fails it.
concurrency:
  group: nightly-reify
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.1
  ROC_REPO: Karakatiza666/roc
jobs:
  resolve-roc-ref:
    name: Resolve roc commit and date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_full: ${{ steps.resolve.outputs.sha_full }}
      date: ${{ steps.resolve.outputs.date }}
      base_nightly: ${{ steps.resolve.outputs.base_nightly }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      # There is no CI-green check for the fork. The caller names the commit
      # and the upstream nightly it is rebased on. This step checks that both
      # exist and that the base commit is an ancestor of the commit to build.
      - name: Resolve ref, base nightly and tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          BASE_NIGHTLY: ${{ inputs.base_nightly }}
        run: |
          set -euo pipefail

          if ! [[ "$BASE_NIGHTLY" =~ ^nightly-([0-9]{4}-[0-9]{2}-[0-9]{2})-([0-9a-f]{7,40})$ ]]; then
            echo "::error::base_nightly '$BASE_NIGHTLY' does not match nightly-YYYY-MM-DD-<sha>, for example nightly-2026-11-03-34bd006."
            exit 1
          fi
          DATE="${BASH_REMATCH[1]}"
          BASE_SHA="${BASH_REMATCH[2]}"

          # The base nightly has to be a real upstream release.
          if ! gh api "repos/roc-lang/nightlies/releases/tags/$BASE_NIGHTLY" --silent; then
            echo "::error::No release $BASE_NIGHTLY exists in roc-lang/nightlies."
            exit 1
          fi

          if ! picked=$(gh api "repos/$ROC_REPO/commits/$REF" --jq .sha); then
            echo "::error::Could not resolve ref '$REF' in $ROC_REPO."
            exit 1
          fi
          short="${picked:0:7}"

          if ! base_full=$(gh api "repos/roc-lang/roc/commits/$BASE_SHA" --jq .sha); then
            echo "::error::Could not resolve base commit $BASE_SHA in roc-lang/roc."
            exit 1
          fi

          # "identical" and "ahead" mean the base is the commit itself or one
          # of its ancestors. "behind" and "diverged" mean it is not.
          status=$(gh api "repos/$ROC_REPO/compare/$base_full...$picked" --jq .status)
          case "$status" in
            identical|ahead) echo "$ROC_REPO $short is $status of the base $BASE_NIGHTLY ($base_full)." ;;
            *)
              echo "::error::The base commit ${base_full:0:7} of $BASE_NIGHTLY is not an ancestor of $ROC_REPO $short (compare status: $status). Rebase the ref on that nightly, or pass the matching base_nightly."
              exit 1
              ;;
          esac

          # The date comes from the base nightly, so the tag lines up with the
          # upstream nightly the fork is rebased on.
          TAG="nightly-reify-$DATE-$short"

          # The tag is the single source of truth for this release's identity:
          # it names the release, and is baked into the binary via roc's
          # -Dcompiler-version so `roc version` reports the release the user
          # actually downloaded. It must be free.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null \
            || gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The tag or release $TAG already exists in $GITHUB_REPOSITORY. Delete it first if a rebuild is really wanted."
            exit 1
          fi

          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "sha=$short" >> $GITHUB_OUTPUT
          echo "sha_full=$picked" >> $GITHUB_OUTPUT
          echo "base_nightly=$BASE_NIGHTLY" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # The gate builds one platform in one mode before anything else builds. If
  # roc does not compile, or the binary cannot run a Roc program, the run stops
  # here: every other build, the wasm artifacts and the release are skipped,
  # and no compute goes into the other builds, which would fail the same way.
  # It builds linux_x86_64 release because that is the cheapest runner and the
  # archive most users download.
  build-gate:
    name: build and package nightly release (gate, linux_x86_64 release)
    needs: resolve-roc-ref
    runs-on: ubuntu-22.04

    steps:
      # Also brings in the build-and-package action and hello_world_test.roc.
      - name: Checkout nightlies repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: nightlies-repo

      # Same action as the build-and-package matrix, so the gate cannot drift
      # from the legs it stands in for.
      - name: Build and package
        uses: ./nightlies-repo/.github/actions/build-and-package
        with:
          os: ubuntu-22.04
          artifact_name: linux_x86_64
          mode: release
          roc_repo: ${{ env.ROC_REPO }}
          roc_sha_full: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          tag: ${{ needs.resolve-roc-ref.outputs.tag }}
          sha: ${{ needs.resolve-roc-ref.outputs.sha }}
          date: ${{ needs.resolve-roc-ref.outputs.date }}
          zig_version: ${{ env.ZIG_VERSION }}

  build-and-package:
    name: build and package nightly release
    needs: [resolve-roc-ref, build-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release: optimized and stripped, the archives most users want.
        # debug: unoptimized and with debug info, for crash reports. Built for
        # Linux only.
        mode: [release, debug]
        artifact_name:
          - macos_x86_64
          - macos_apple_silicon
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          #- windows_arm64
        exclude:
          # build-gate already built this one.
          - mode: release
            artifact_name: linux_x86_64
          - mode: debug
            artifact_name: macos_x86_64
          - mode: debug
            artifact_name: macos_apple_silicon
          - mode: debug
            artifact_name: windows_x86_64
        include:
          - artifact_name: macos_x86_64
            os: macos-15-intel
          - artifact_name: macos_apple_silicon
            os: macos-15
          - artifact_name: linux_x86_64
            os: ubuntu-22.04
          - artifact_name: linux_arm64
            os: ubuntu-24.04-arm
          - artifact_name: windows_x86_64
            os: windows-2022
          #- artifact_name: windows_arm64
          #  os: windows-11-arm

    steps:
      # Also brings in the build-and-package action and hello_world_test.roc.
      - name: Checkout nightlies repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: nightlies-repo

      - name: Build and package
        uses: ./nightlies-repo/.github/actions/build-and-package
        with:
          os: ${{ matrix.os }}
          artifact_name: ${{ matrix.artifact_name }}
          mode: ${{ matrix.mode }}
          roc_repo: ${{ env.ROC_REPO }}
          roc_sha_full: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          tag: ${{ needs.resolve-roc-ref.outputs.tag }}
          sha: ${{ needs.resolve-roc-ref.outputs.sha }}
          date: ${{ needs.resolve-roc-ref.outputs.date }}
          zig_version: ${{ env.ZIG_VERSION }}

  # The wasm builds compile roc too, so they wait for the gate like the matrix.
  build-wasm-artifacts:
    name: build compressed web wasm artifacts
    needs: [resolve-roc-ref, build-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Karakatiza666/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: ${{ env.ROC_REPO }}
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # ratchet:mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Build playground wasm archive
        uses: ./roc-src/.github/actions/flaky-retry
        with:
          command: 'cd roc-src && zig build build-playground-wasm-archive -Doptimize=ReleaseSmall -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload playground.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: playground.wasm.zst
          path: roc-src/zig-out/lib/playground/playground.wasm.zst
          if-no-files-found: error
          retention-days: 4

      - name: Build REPL wasm archive
        uses: ./roc-src/.github/actions/flaky-retry
        with:
          command: 'cd roc-src && zig build build-repl-wasm-archive -Doptimize=ReleaseSmall -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload repl.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: repl.wasm.zst
          path: roc-src/zig-out/lib/repl/repl.wasm.zst
          if-no-files-found: error
          retention-days: 4

      - name: Build roc compiler wasm archive
        uses: ./roc-src/.github/actions/flaky-retry
        with:
          command: 'cd roc-src && zig build build-echo-wasm-archive -Doptimize=ReleaseSmall -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload echo.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: echo.wasm.zst
          path: roc-src/zig-out/lib/echo/echo.wasm.zst
          if-no-files-found: error
          retention-days: 4

  # This job compiles nothing and takes about a minute, so it does not wait for
  # build-gate. If the gate fails, its archive is uploaded but never published.
  package-source:
    name: Package roc source code
    needs: resolve-roc-ref
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      DATE: ${{ needs.resolve-roc-ref.outputs.date }}

    steps:
      # GitHub's own "Source code" assets on a release are the source of *this*
      # repo at the tag, which is just the workflow, not the compiler that was
      # built. Ship the Karakatiza666/roc tree at the exact commit these binaries
      # came from, so a release stays buildable even if that commit later
      # disappears from Karakatiza666/roc (force-push, rewritten history, deleted repo).
      - name: Checkout Karakatiza666/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: ${{ env.ROC_REPO }}
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      - name: build file name
        run: echo "SOURCE_FOLDER_NAME=roc_nightly-reify-source-$DATE-$SHA" >> $GITHUB_ENV

      - name: Prepare source folder
        run: |
          # .git here is a shallow, unusable-for-history checkout; dropping it
          # keeps the archive to the source that was actually compiled.
          rm -rf ./roc-src/.git
          mv ./roc-src "${{ env.SOURCE_FOLDER_NAME }}"
          # The folder name only carries the short sha, so record the full
          # commit the archive was cut from.
          echo "${{ needs.resolve-roc-ref.outputs.sha_full }}" > "${{ env.SOURCE_FOLDER_NAME }}/NIGHTLY_SOURCE_COMMIT"

      # Both formats, matching what GitHub attaches to a release itself:
      # tar.gz for unix, zip because Windows extracts it without extra tools.
      - name: Compress source (tar.gz)
        run: tar -czf "${{ env.SOURCE_FOLDER_NAME }}.tar.gz" "${{ env.SOURCE_FOLDER_NAME }}"

      - name: Compress source (zip)
        run: zip -r -q "${{ env.SOURCE_FOLDER_NAME }}.zip" "${{ env.SOURCE_FOLDER_NAME }}"

      - name: Calculate archive hashes for security purposes
        run: sha256sum "${{ env.SOURCE_FOLDER_NAME }}.tar.gz" "${{ env.SOURCE_FOLDER_NAME }}.zip"

      - name: Upload roc source archive (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_FOLDER_NAME }}.tar.gz
          path: ${{ env.SOURCE_FOLDER_NAME }}.tar.gz
          retention-days: 4

      - name: Upload roc source archive (zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_FOLDER_NAME }}.zip
          path: ${{ env.SOURCE_FOLDER_NAME }}.zip
          retention-days: 4

  publish-release:
    name: Publish release to GitHub
    # One platform failing to build must not sink the whole nightly: the
    # archives that did build are still worth shipping, and a missing one is
    # better than nothing at all for that day. So instead of inheriting the
    # default "skip if any dependency failed", this job runs as long as the
    # run was not cancelled, resolve-roc-ref itself produced a tag and
    # build-gate succeeded. Which archives actually exist is decided below,
    # from what was uploaded. The failed build leg still shows up red, so the
    # run as a whole is still reported as failed.
    #
    # A failed gate is different: then nothing else was built, and the release
    # is not published.
    if: >-
      ${{ !cancelled()
        && needs.resolve-roc-ref.result == 'success'
        && needs.build-gate.result == 'success' }}
    needs: [resolve-roc-ref, build-gate, build-and-package, build-wasm-artifacts, package-source]
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.built.outputs.test_matrix }}
    permissions:
      contents: write
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      SHA_FULL: ${{ needs.resolve-roc-ref.outputs.sha_full }}
      BASE_NIGHTLY: ${{ needs.resolve-roc-ref.outputs.base_nightly }}
      TAG: ${{ needs.resolve-roc-ref.outputs.tag }}

    steps:
      - name: Checkout nightlies repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # ratchet:actions/download-artifact@v5.0.0
        with:
          path: ./artifacts

      # Because this job now runs even when a build leg failed, it has to work
      # out for itself which platforms made it into ./artifacts, warn about the
      # ones that did not, and refuse to publish a release with no release-mode
      # binaries at all (debug archives alone are not a release). The list it
      # produces also drives the smoke-test matrix below, so those don't try to
      # download an archive that was never released.
      #
      # Each entry of the list is <mode>:<platform>. A debug archive is named
      # roc_nightly-reify-debug-<platform>-..., and no platform name starts
      # with "debug-", so the release glob never matches a debug archive.
      - name: Determine which archives were built
        id: built
        run: |
          set -euo pipefail

          built=()
          release_count=0
          debug_count=0
          # Debug archives are built for Linux only.
          for entry in release:macos_x86_64 release:macos_apple_silicon release:linux_x86_64 release:linux_arm64 release:windows_x86_64 debug:linux_x86_64 debug:linux_arm64; do
            mode="${entry%%:*}"
            platform="${entry#*:}"
            if [ "$mode" = debug ]; then prefix="debug-"; else prefix=""; fi
            if compgen -G "artifacts/roc_nightly-reify-$prefix$platform-*/*" > /dev/null; then
              built+=("$mode:$platform")
              if [ "$mode" = debug ]; then
                debug_count=$((debug_count + 1))
              else
                release_count=$((release_count + 1))
              fi
            else
              echo "::warning::No $mode archive was built for $platform; it will be missing from $TAG."
            fi
          done

          if [ "$release_count" -eq 0 ]; then
            echo "::error::No release-mode platform archives were built, refusing to publish a release without binaries."
            exit 1
          fi
          echo "Publishing archives for: ${built[*]}"
          if [ "$debug_count" -gt 0 ]; then
            echo "has_debug=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_debug=false" >> "$GITHUB_OUTPUT"
          fi

          for extra in playground.wasm.zst repl.wasm.zst echo.wasm.zst "roc_nightly-reify-source-*"; do
            compgen -G "artifacts/$extra/*" > /dev/null \
              || echo "::warning::$extra is missing from $TAG."
          done

          # Every OS the smoke tests cover, paired with the archive it needs.
          # Legs whose archive is missing are dropped rather than left to fail
          # on a 404 download. Release archives are tested on every OS. Debug
          # archives (Linux only) come from the same target settings, so one
          # OS for each platform is sufficient for them.
          #- {os: windows-11-arm, artifact_name: windows_arm64, mode: release}
          matrix=$(jq -cn --args '
            [
              {os: "macos-15-intel", artifact_name: "macos_x86_64",        mode: "release"},
              {os: "macos-15",       artifact_name: "macos_apple_silicon", mode: "release"},
              {os: "macos-26-intel", artifact_name: "macos_x86_64",        mode: "release"},
              {os: "macos-26",       artifact_name: "macos_apple_silicon", mode: "release"},
              {os: "ubuntu-22.04",   artifact_name: "linux_x86_64",        mode: "release"},
              {os: "ubuntu-26.04",   artifact_name: "linux_x86_64",        mode: "release"},
              {os: "ubuntu-26.04-arm", artifact_name: "linux_arm64",       mode: "release"},
              {os: "windows-2022",   artifact_name: "windows_x86_64",      mode: "release"},
              {os: "windows-2025",   artifact_name: "windows_x86_64",      mode: "release"},
              {os: "ubuntu-22.04",   artifact_name: "linux_x86_64",        mode: "debug"},
              {os: "ubuntu-26.04-arm", artifact_name: "linux_arm64",       mode: "debug"}
            ] | map(select("\(.mode):\(.artifact_name)" as $a | $ARGS.positional | index($a)))
            | {include: .}' "${built[@]}")
          echo "$matrix"
          echo "test_matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Create Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_DEBUG: ${{ steps.built.outputs.has_debug }}
        run: |
          BODY="Nightly build of the new Roc compiler from the reify branch of [Karakatiza666/roc](https://github.com/Karakatiza666/roc), commit [${{ env.SHA }}](https://github.com/Karakatiza666/roc/commit/${{ env.SHA_FULL }}), rebased on upstream nightly [${{ env.BASE_NIGHTLY }}](https://github.com/roc-lang/nightlies/releases/tag/${{ env.BASE_NIGHTLY }}).

          The \`roc_nightly-reify-source-*\` archives contain the Karakatiza666/roc source these binaries were built from. GitHub's own \"Source code\" assets below are just this workflow repo."

          if [ "$HAS_DEBUG" = true ]; then
            BODY="$BODY

          The \`roc_nightly-reify-debug-*\` archives contain unoptimized builds with debug info, for crash reports only: they are larger and much slower than the normal archives."
          fi

          # Create the release (non-draft, non-prerelease)
          gh release create "$TAG" artifacts/**/* \
            --title "$TAG" \
            --notes "$BODY" \
            --latest=true

  test-archives:
    name: Test nightly release archives
    # A failed build leg does not just skip publish-release, it skips
    # everything downstream of it: the skip propagates through the whole
    # dependency graph, so opting publish-release out of it is not enough and
    # this job has to opt out too. What it needs is only that the release was
    # actually published; the matrix it gets from there already covers just
    # the archives that shipped.
    if: >-
      ${{ !cancelled()
        && needs.publish-release.result == 'success' }}
    needs: [resolve-roc-ref, publish-release]
    runs-on: ${{ matrix.os }}
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      DATE: ${{ needs.resolve-roc-ref.outputs.date }}
      TAG: ${{ needs.resolve-roc-ref.outputs.tag }}
    strategy:
      fail-fast: false
      # Built in publish-release, from the archives that actually shipped: a
      # platform that failed to build has no archive to smoke test, and a leg
      # for it would only fail on the download.
      matrix: ${{ fromJSON(needs.publish-release.outputs.test_matrix) }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      # The same names as the build-and-package action gives the archives.
      - name: build file name
        env:
          PREFIX: ${{ matrix.mode == 'debug' && 'debug-' || '' }}
        run: echo "RELEASE_FOLDER_NAME=roc_nightly-reify-${PREFIX}${{ matrix.artifact_name }}-$DATE-$SHA" >> $GITHUB_ENV

      - name: Download release archive (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "${{ env.RELEASE_FOLDER_NAME }}.tar.gz" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/${{ env.RELEASE_FOLDER_NAME }}.tar.gz"

      - name: Download release archive (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "${{ env.RELEASE_FOLDER_NAME }}.zip" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/${{ env.RELEASE_FOLDER_NAME }}.zip"

      - name: Print CPU model (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty Name

      - name: Print CPU model (macOS)
        if: runner.os == 'macOS'
        run: sysctl -a | grep machdep.cpu.brand_string || true

      - name: Print CPU model (Linux)
        if: runner.os == 'Linux'
        run: lscpu | grep "Model name"

      - name: Decompress release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -xzf "${{ env.RELEASE_FOLDER_NAME }}.tar.gz"

      - name: Decompress release archive (Windows)
        if: runner.os == 'Windows'
        run: |
          7z x "${{ env.RELEASE_FOLDER_NAME }}.zip"

      - name: Checkout nightlies repo for hello_world_test.roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: nightlies-repo

      # The version is baked in by -Dcompiler-version at build time, so nothing
      # downstream can notice if that flag stops being passed and the binaries
      # silently go back to reporting "release-fast-<sha>". This is that check.
      # -Dcompiler-version replaces the whole version string in every build
      # mode, so a debug build reports the tag too, not "debug-<sha>".
      - name: Check reported version matches the release tag
        run: |
          version_out="$(./${{ env.RELEASE_FOLDER_NAME }}/roc version)"
          echo "$version_out"
          expected="Roc compiler version $TAG"
          if [ "$version_out" != "$expected" ]; then
            echo "Expected '$expected' but got '$version_out'."
            exit 1
          fi

      - name: Run hello_world_test.roc (Unix)
        if: runner.os != 'Windows'
        run: |
          ./${{ env.RELEASE_FOLDER_NAME }}/roc fmt nightlies-repo/hello_world_test.roc
          ./${{ env.RELEASE_FOLDER_NAME }}/roc nightlies-repo/hello_world_test.roc

      - name: Run hello_world_test.roc (Windows)
        if: runner.os == 'Windows'
        run: |
          ./${{ env.RELEASE_FOLDER_NAME }}/roc fmt nightlies-repo/hello_world_test.roc
          ./${{ env.RELEASE_FOLDER_NAME }}/roc nightlies-repo/hello_world_test.roc
